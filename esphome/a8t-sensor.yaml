# Plug A: watches its own power draw and, while a load is running,
# tells plug B (via ESP-NOW) to switch on. No router needed.
substitutions:
  name: a8t-sensor
  peer_mac: "FC:B4:67:35:67:C0"   # plug B's MAC
  threshold_w: "10"               # watts that count as "load detected" (idle noise reads ~3 W)

esphome:
  name: ${name}
  on_boot:
    priority: -100
    then:
      - espnow.set_channel:
          channel: 1

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

# wifi + ota are required for the over-the-air migration from Tasmota.
# With wifi enabled, ESP-NOW uses the router's channel (no `channel:`).
wifi:
  # FIRST-INSTALL BUILD: WiFi stays on so the plug joins the router.
  # After migrating, uncomment to turn WiFi off at boot (button hold 10s enables it):
  # enable_on_boot: false
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # If the router can't be reached (~1 min), open a hotspot so the plug
  # can always be reached again. Join it, open http://192.168.4.1 and
  # upload a new firmware.bin or change the WiFi.
  ap:
    ssid: "a8t-sensor-fallback"
    password: !secret ap_password

captive_portal:

ota:
  - platform: esphome

espnow:
  peers:
    - ${peer_mac}

output:
  - platform: gpio
    pin: GPIO13
    id: relay_out

switch:
  - platform: output
    name: "Relay"
    id: relay
    output: relay_out
    restore_mode: RESTORE_DEFAULT_ON

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO4
      mode: INPUT_PULLUP
      inverted: true
    id: button
    on_multi_click:
      - timing:
          - ON for at most 1s
        then:
          - switch.toggle: relay
      - timing:
          - ON for at least 10s
        then:
          - logger.log: "Maintenance: enabling WiFi + hotspot for 15 min"
          - wifi.enable:
          - delay: 15min
          - lambda: "App.safe_reboot();"

status_led:
  pin:
    number: GPIO2
    inverted: true

sensor:
  - platform: hlw8012
    model: BL0937
    sel_pin:
      number: GPIO14
      inverted: true
    cf_pin: GPIO27
    cf1_pin: GPIO26
    update_interval: 5s
    # ESPHome defaults, scaled by the filters below to match Tasmota's
    # calibration (PowerCal 12530, VoltageCal 1950, CurrentCal 3500).
    current_resistor: 0.001
    voltage_divider: 2351
    power:
      name: "Power"
      id: power_w
      unit_of_measurement: W
      filters:
        - multiply: 0.8423
      on_value:
        then:
          - if:
              condition:
                lambda: "return x > ${threshold_w};"
              then:
                - espnow.send:
                    address: ${peer_mac}
                    data: [0x01]
                    continue_on_error: true
    current:
      name: "Current"
      filters:
        - multiply: 0.8974
    voltage:
      name: "Voltage"
      filters:
        - multiply: 0.8619
