# Plug B: switches on for 30 minutes whenever plug A sends the trigger
# over ESP-NOW, then switches off. Re-triggers restart the 30 minutes.
substitutions:
  name: a8t-receiver
  peer_mac: "FC:B4:67:39:52:18"   # plug A's MAC
  on_time: 30min

esphome:
  name: ${name}
  on_boot:
    priority: -100
    then:
      - espnow.set_channel:
          channel: 1

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

wifi:
  # FIRST-INSTALL BUILD: WiFi stays on so the plug joins the router.
  # After migrating, uncomment to turn WiFi off at boot (button hold 10s enables it):
  # enable_on_boot: false
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # If the router can't be reached (~1 min), open a hotspot so the plug
  # can always be reached again. Join it, open http://192.168.4.1 and
  # upload a new firmware.bin or change the WiFi.
  ap:
    ssid: "a8t-receiver-fallback"
    password: !secret ap_password

captive_portal:

ota:
  - platform: esphome
    allow_partition_access: true   # first image only; remove afterwards

espnow:
  peers:
    - ${peer_mac}
  on_receive:
    - address: ${peer_mac}
      then:
        - if:
            condition:
              lambda: "return size >= 1 && data[0] == 0x01;"
            then:
              - script.execute: run_timer

output:
  - platform: gpio
    pin: GPIO13
    id: relay_out

switch:
  - platform: output
    name: "Relay"
    id: relay
    output: relay_out
    restore_mode: ALWAYS_OFF

script:
  - id: run_timer
    mode: restart
    then:
      - switch.turn_on: relay
      - delay: ${on_time}
      - switch.turn_off: relay

binary_sensor:
  - platform: gpio
    id: button
    pin:
      number: GPIO4
      mode: INPUT_PULLUP
      inverted: true
    on_multi_click:
      - timing:
          - ON for at most 1s
        then:
          - script.stop: run_timer
          - switch.toggle: relay
      - timing:
          - ON for at least 10s
        then:
          - logger.log: "Maintenance: enabling WiFi + hotspot for 15 min"
          - wifi.enable:
          - delay: 15min
          - lambda: "App.safe_reboot();"

status_led:
  pin:
    number: GPIO2
    inverted: true
